<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LofiStack Component Gallery</title>
    <meta name="description" content="30 reusable UI components for marketing, CRM, ads, SEO and AI teams — built with React, TypeScript and Tailwind CSS." />
    <meta property="og:title" content="LofiStack Component Gallery" />
    <meta property="og:description" content="30 reusable UI components for marketing, CRM, ads, SEO and AI teams — built with React, TypeScript and Tailwind CSS." />
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // apply the theme before first paint (saved choice, else the OS preference)
      try {
        var t = localStorage.getItem("lsg-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:48px 24px;font-family:system-ui,sans-serif">
        <h1>LofiStack Component Gallery</h1>
        <p>30 reusable UI components. Please enable JavaScript to view the interactive gallery.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
